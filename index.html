<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machinarium &middot; v86 Windows XP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }
        .topbar {
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            border-bottom: 2px solid #f4a259;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .topbar .title {
            font-size: 1.3rem;
            color: #f4a259;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .topbar .title span { color: #e9c46a; font-size: 0.85rem; letter-spacing: 0; margin-left: 10px; font-weight: normal; }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(244,162,89,0.15);
            border: 1px solid #f4a259;
            color: #f4a259;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: #f4a259; color: #0d0d1a; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn:disabled:hover { background: rgba(244,162,89,0.15); color: #f4a259; }
        .main { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 16px; }
        .screen-wrap {
            width: 100%;
            max-width: 960px;
            background: #000;
            border: 2px solid #2a3a5e;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
        }
        #screen { width: 100%; height: 100%; display: block; }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13,13,26,0.92);
            z-index: 10;
            gap: 16px;
            padding: 20px;
        }
        .overlay.hidden { display: none; }
        .overlay .logo { font-size: 2.2rem; color: #f4a259; letter-spacing: 4px; font-weight: bold; }
        .overlay .logo-cn { font-size: 1rem; color: #e9c46a; letter-spacing: 2px; }
        .overlay .status { color: #aaa; font-size: 0.9rem; text-align: center; max-width: 400px; line-height: 1.7; }
        .progress-bar {
            width: 280px; height: 6px;
            background: #1e2a4a;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f4a259, #e9c46a);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text { color: #888; font-size: 0.8rem; }
        .info-bar {
            width: 100%;
            max-width: 960px;
            background: #16213e;
            border: 1px solid #2a3a5e;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: #888;
        }
        .info-bar .item { display: flex; align-items: center; gap: 6px; }
        .info-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .info-bar .dot.ok { background: #4caf50; }
        .info-bar .dot.warn { background: #f4a259; }
        .info-bar .dot.err { background: #e57373; }
        .footer { text-align: center; padding: 20px; color: #444; font-size: 0.75rem; }
        @media (max-width: 600px) {
            .topbar { padding: 10px 12px; }
            .topbar .title { font-size: 1rem; }
            .btn { padding: 5px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="title">MACHINARIUM <span>v86 Windows XP</span></div>
    <div class="controls">
        <button class="btn" id="btnPower" onclick="togglePower()">▶ 启动</button>
        <button class="btn" id="btnReset" onclick="doReset()" disabled>↺ 重置</button>
        <button class="btn" id="btnFullscreen" onclick="toggleFullscreen()">⛶ 全屏</button>
        <button class="btn" id="btnSave" onclick="saveState()" disabled>💾 保存状态</button>
        <button class="btn" id="btnLoad" onclick="loadState()" disabled>📂 加载状态</button>
    </div>
</div>

<div class="main">
    <div class="screen-wrap" id="screenWrap">
        <canvas id="screen"></canvas>
        <div class="overlay" id="overlay">
            <div class="logo">MACHINARIUM</div>
            <div class="logo-cn">机 械 迷 城</div>
            <div class="status" id="statusText">点击下方「启动」按钮开始运行 Windows XP 模拟器</div>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText"></div>
        </div>
    </div>

    <div class="info-bar">
        <div class="item"><div class="dot" id="dotCore"></div><span>核心引擎</span></div>
        <div class="item"><div class="dot" id="dotBIOS"></div><span>BIOS</span></div>
        <div class="item"><div class="dot" id="dotISO"></div><span>ISO 镜像</span></div>
        <div class="item"><div class="dot" id="dotEmu"></div><span>模拟器</span></div>
        <div class="item" style="margin-left:auto;color:#666;" id="timeInfo"></div>
    </div>
</div>

<div class="footer">
    <p>Machinarium &copy; Amanita Design, s.r.o. &middot; v86 Windows XP Emulator &middot; 仅供个人学习研究使用</p>
</div>

<script type="text/javascript" src="build/libv86.js"></script>
<script>
const PRESETS = {
    memory_size: 256 * 1024 * 1024,
    vga_memory_size: 16 * 1024 * 1024,
    bios_path: "bios/seabios.bin",
    vga_bios_path: "bios/vgabios.bin",
    wasm_path: "build/v86.wasm",
    cdrom_gz_url: "VirtualXP.iso.gz",
    cdrom_decompressed_url: "VirtualXP.iso",
};

let emulator = null;
let isPowered = false;
let isoBuffer = null;

function setProgress(pct, text) {
    const bar = document.getElementById("progressBar");
    const fill = document.getElementById("progressFill");
    const txt = document.getElementById("progressText");
    if (pct >= 0) { bar.classList.add("active"); fill.style.width = pct + "%"; txt.textContent = text || ""; }
    else { bar.classList.remove("active"); txt.textContent = ""; }
}

function setStatus(text) { document.getElementById("statusText").textContent = text; }

function setDot(id, state) {
    const dot = document.getElementById(id);
    dot.className = "dot " + (state === "ok" ? "ok" : state === "warn" ? "warn" : state === "err" ? "err" : "");
}

async function loadCompressedISO() {
    const cacheName = "machinarium-v86-assets-v1";
    const supportsCache = "caches" in window;
    const supportsDecompression = "DecompressionStream" in window;

    if (supportsCache) {
        try {
            const cache = await window.caches.open(cacheName);
            const cached = await cache.match(PRESETS.cdrom_decompressed_url);
            if (cached) {
                setStatus("从缓存加载 ISO（秒开）...");
                setProgress(100, "缓存命中");
                return await cached.arrayBuffer();
            }
        } catch (e) { /* private mode */ }
    }

    setStatus("正在下载压缩镜像...");
    setProgress(0, "下载中...");

    const resp = await fetch(PRESETS.cdrom_gz_url);
    if (!resp.ok) throw new Error("ISO 下载失败: " + resp.status);

    const total = parseInt(resp.headers.get("content-length"), 10);
    let loaded = 0;
    const reader = resp.body.getReader();
    const chunks = [];
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        if (total) {
            const pct = Math.round((loaded / total) * 100);
            setProgress(pct, "下载中 " + pct + "%");
        } else {
            setProgress(0, "下载中 " + (loaded / 1048576).toFixed(1) + " MB...");
        }
    }

    setStatus("正在解压镜像...");
    setProgress(80, "解压中...");

    const compressedBlob = new Blob(chunks);
    let uncompressedBuffer;
    if (supportsDecompression) {
        const ds = new DecompressionStream("gzip");
        const stream = compressedBlob.stream().pipeThrough(ds);
        const decompressedResp = new Response(stream);
        uncompressedBuffer = await decompressedResp.arrayBuffer();
    } else {
        throw new Error("浏览器不支持 gzip 解压，请使用 Chrome/Edge/Firefox 最新版");
    }

    if (supportsCache) {
        try {
            const cache = await window.caches.open(cacheName);
            await cache.put(PRESETS.cdrom_decompressed_url, new Response(uncompressedBuffer, {
                headers: { "Content-Length": uncompressedBuffer.byteLength.toString() }
            }));
        } catch (e) { /* quota exceeded */ }
    }

    setProgress(100, "下载完成");
    return uncompressedBuffer;
}

async function togglePower() {
    if (isPowered) return;
    isPowered = true;
    document.getElementById("btnPower").disabled = true;
    document.getElementById("btnPower").textContent = "⏳ 运行中";
    document.getElementById("btnReset").disabled = false;
    document.getElementById("btnSave").disabled = false;
    document.getElementById("btnLoad").disabled = false;
    setDot("dotCore", "ok");
    setDot("dotBIOS", "ok");
    setDot("dotISO", "warn");
    setStatus("正在启动模拟器...");
    setProgress(0, "加载中...");

    try {
        isoBuffer = await loadCompressedISO();
        setDot("dotISO", "ok");
        setStatus("正在初始化模拟器...");
        setProgress(90, "初始化中...");
    } catch (e) {
        console.error(e);
        setStatus("ISO 加载失败: " + e.message);
        setProgress(-1, "");
        setDot("dotISO", "err");
        isPowered = false;
        document.getElementById("btnPower").disabled = false;
        document.getElementById("btnPower").textContent = "▶ 启动";
        return;
    }

    try {
        emulator = new V86({
            wasm_path: PRESETS.wasm_path,
            memory_size: PRESETS.memory_size,
            vga_memory_size: PRESETS.vga_memory_size,
            screen_container: document.getElementById("screenWrap"),
            bios: { url: PRESETS.bios_path },
            vga_bios: { url: PRESETS.vga_bios_path },
            cdrom: { buffer: isoBuffer },
            boot_order: 0x213,
            autostart: true,
            network_relay_url: null,
        });
    } catch (initErr) {
        console.error("V86 init failed:", initErr);
        setStatus("模拟器初始化失败: " + (initErr && initErr.message ? initErr.message : initErr));
        setProgress(-1, "");
        setDot("dotEmu", "err");
        isPowered = false;
        emulator = null;
        isoBuffer = null;
        document.getElementById("btnPower").disabled = false;
        document.getElementById("btnPower").textContent = "▶ 启动";
        return;
    }

    emulator.add_listener("emulator-ready", function() {
        setStatus("核心就绪，正在引导...");
        setProgress(95, "引导中...");
    });

    emulator.add_listener("emulator-started", function() {
        setDot("dotEmu", "ok");
        setProgress(100, "系统运行中");
        document.getElementById("overlay").classList.add("hidden");
        if (emulator.audio_adapter) emulator.audio_adapter.init();
    });

    emulator.add_listener("download-progress", function(e) {
        if (e.total && e.total > 0) {
            const pct = Math.round((e.loaded / e.total) * 100);
            setProgress(pct, e.file_name + " " + pct + "%");
        }
    });

    emulator.add_listener("stop", function() {
        setDot("dotEmu", "warn");
        setStatus("模拟器已停止");
        document.getElementById("overlay").classList.remove("hidden");
        document.getElementById("btnPower").disabled = false;
        document.getElementById("btnPower").textContent = "▶ 重新启动";
        isPowered = false;
    });

    document.getElementById("screenWrap").addEventListener("mousedown", function() {
        emulator.lock_mouse();
    });
}

function doReset() {
    if (emulator) { emulator.stop(); emulator = null; }
    isPowered = false;
    isoBuffer = null;
    document.getElementById("btnPower").disabled = false;
    document.getElementById("btnPower").textContent = "▶ 启动";
    document.getElementById("btnReset").disabled = true;
    document.getElementById("btnSave").disabled = true;
    document.getElementById("btnLoad").disabled = true;
    setDot("dotEmu", "");
    document.getElementById("overlay").classList.remove("hidden");
    setStatus("点击下方「启动」按钮开始运行 Windows XP 模拟器");
    setProgress(-1, "");
}

function toggleFullscreen() {
    const wrap = document.getElementById("screenWrap");
    if (!document.fullscreenElement) { wrap.requestFullscreen().catch(()=>{}); }
    else { document.exitFullscreen(); }
}

async function saveState() {
    if (!emulator) return;
    setStatus("正在保存状态...");
    setProgress(0, "保存中...");
    const data = await emulator.save_state();
    const blob = new Blob([data], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "machinarium_state_" + new Date().toISOString().replace(/[:.]/g,"-") + ".state";
    a.click();
    URL.revokeObjectURL(url);
    setStatus("状态已保存");
    setProgress(-1, "");
}

function loadState() {
    if (!emulator) return;
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".state";
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setStatus("正在加载状态...");
        setProgress(0, "加载中...");
        const data = await file.arrayBuffer();
        try {
            await emulator.restore_state(data);
            setStatus("状态已加载");
            setProgress(-1, "");
            if (emulator.audio_adapter) emulator.audio_adapter.init();
        } catch (err) {
            setStatus("加载失败: " + err.message);
            setProgress(-1, "");
        }
    };
    input.click();
}

setDot("dotCore", "ok");
setDot("dotBIOS", "ok");
setProgress(0, "核心就绪");
setDot("dotISO", "warn");
setStatus("准备就绪 — 点击「启动」加载镜像");
setProgress(-1, "");
</script>

</body>
</html>
